name: Continuous Engagement Optimization & Scheduling

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-and-schedule:
    runs-on: ubuntu-latest

    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          pip install requests

      - name: Install Zernio CLI
        run: |
          npm install -g @zernio/cli

      - name: Configure Zernio API key
        run: |
          zernio auth:set --key "${{ secrets.ZERNIO_API_KEY }}"

      - name: Run engagement optimization
        run: |
          python3 scripts/optimize_engagement.py

      - name: Run scheduler
        run: |
          python3 schedule_5_per_day.py

      - name: Purge duplicates
        run: |
          python3 purge_zernio_duplicates.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.log logs/engagement_weights.json
          git commit -m "Auto-optimize engagement weights & schedule posts [skip ci]" || echo "No changes to commit"
          git push
